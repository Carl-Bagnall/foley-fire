name: Preview on Cloudflare Workers

# Deploys any non-main branch to a dedicated staging Worker
# (staging-foley-fire) so the preview always lives at the same URL:
#   https://staging-foley-fire.carlbagnall.workers.dev
# This is a separate Worker from production (foley-fire), so main is
# never affected. The staging Worker reuses worker.js, so it stays behind
# HTTP Basic Auth — set SITE_PASSWORD on the staging Worker once in the
# Cloudflare dashboard (Settings -> Variables and Secrets), or it returns
# 503 (fails closed). Each preview push overwrites this one staging Worker.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    concurrency:
      group: preview-staging-foley-fire
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to staging Worker
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          out=$(npx --yes wrangler@4.100.0 deploy --name staging-foley-fire 2>&1 | tee /dev/stderr)
          url=$(printf '%s\n' "$out" | grep -oE 'https://[A-Za-z0-9.-]+workers\.dev' | head -n1)
          {
            echo "## Staging preview"
            echo ""
            echo "Branch: \`${GITHUB_REF_NAME}\`"
            echo ""
            if [ -n "$url" ]; then
              echo "Preview URL: $url"
            else
              echo "Preview URL: https://staging-foley-fire.carlbagnall.workers.dev"
            fi
            echo ""
            echo "_Stable URL, overwritten on each preview push. Behind SITE_PASSWORD"
            echo "(set once on the staging Worker in the Cloudflare dashboard)._"
          } >> "$GITHUB_STEP_SUMMARY"
